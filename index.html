<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Registro QR</title>

<link rel="manifest"
href="manifest.json">

<style>

body{

font-family:Arial,sans-serif;
background:#f2f4f7;
margin:0;
padding:20px;
display:flex;
justify-content:center;
min-height:100vh;

}

.card{

width:100%;
max-width:550px;
background:white;
border-radius:24px;
padding:25px;
box-shadow:
0 10px 25px rgba(0,0,0,.08);

}

.logo{

width:220px;
max-width:90%;
display:block;
margin:auto;
margin-bottom:15px;

}

h1{

font-size:28px;
color:#0f6c6d;
text-align:center;
margin-bottom:20px;

}

h2{

color:#0f6c6d;
text-align:center;

}

h3{

color:#444;

}

input{

width:100%;
box-sizing:border-box;
padding:14px;
font-size:16px;
border-radius:12px;
border:1px solid #ccc;
margin-bottom:10px;

}

button{

width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
color:white;
margin-top:8px;

}

.btn-verde{
background:#198754;
}

.btn-azul{
background:#2c7be5;
}

.btn-principal{
background:#0f6c6d;
}

.btn-rojo{
background:#dc3545;
}

#app{
display:none;
}
<style>

#reader{

width:100%;
max-width:320px;
min-height:320px;

margin:auto;
margin-top:15px;

border:3px solid #198754;

border-radius:14px;

overflow:hidden;

background:#ffffff;

display:block;

}

#contador{

font-size:20px;
font-weight:bold;
margin:15px;
text-align:center;

}

#historial{

max-height:300px;
overflow-y:auto;
border:1px solid #ddd;
border-radius:12px;
padding:10px;
background:#fafafa;
margin-top:15px;

}

#estadoCamara{

font-size:14px;
color:#666;
text-align:center;
margin-top:10px;
font-weight:bold;

}

#cursoActual{

font-weight:bold;
color:#198754;
text-align:center;

}

.firma{

margin-top:25px;
padding-top:15px;
border-top:1px solid #ddd;
font-size:13px;
color:#666;
text-align:center;

}

.firma strong{

display:block;
color:#0f6c6d;
margin-bottom:5px;

}

hr{

margin-top:20px;
margin-bottom:20px;
border:none;
border-top:1px solid #ddd;

}

</style>

</head>

<body>

<div class="card">

<img
src="logo.png"
class="logo">

<h1>

REGISTRO DE USO DE EQUIPOS

</h1>
<div id="login">

<h3>Profesor a cargo</h3>

<input
id="docente"
placeholder="Nombre del docente">

<button
class="btn-azul"
onclick="guardarDocente()">

Guardar docente

</button>

<h3>Curso</h3>

<p id="cursoActual">

Sin curso seleccionado

</p>

<button
class="btn-verde"
onclick="escanearCurso()">

🎓 Escanear curso

</button>

<hr>

<h3>Estudiante</h3>

<input
id="nombreCompleto"
placeholder="Nombre y Apellido">

<button
class="btn-principal"
onclick="guardarUsuario()">

Continuar

</button>

</div>
<div id="app">

<h3 id="usuario"></h3>

<div id="contador">

Escaneados: 0

</div>

<button
class="btn-verde"
onclick="escanearEquipo()">

📦 Escanear equipo

</button>

<button
class="btn-azul"
onclick="siguienteEstudiante()">

➡ Siguiente estudiante

</button>

<button
class="btn-principal"
onclick="deshacer()">

↩ Deshacer último

</button>

<button
class="btn-principal"
onclick="exportarExcel()">

📊 Exportar Excel

</button>

<button
class="btn-rojo"
onclick="nuevaPlanilla()">

🗑 Nueva planilla

</button>

<p id="estadoCamara">

📷 Cámara cerrada

</p>

<div id="reader"></div>

<p
style="
text-align:center;
font-weight:bold;
color:#198754;
margin-top:10px;
">

Apunte la cámara al código QR

</p>

<p id="resultado"></p>

<h2>Historial</h2>

<div id="historial"></div>
<div class="firma">

<strong>

Sistema de Registro QR

</strong>

<div>

Colegio Alberto Blest Gana

</div>

<div>

© 2026 Bastian Andres Sepúlveda Molina

</div>

</div>

</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script src="app.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<title>Registro QR</title>

<meta name="viewport"
content="width=device-width,initial-scale=1">

<link rel="manifest"
href="manifest.json">

<style>

body{

font-family:Arial,sans-serif;

background:#f2f4f7;

margin:0;

padding:20px;

display:flex;

justify-content:center;

align-items:flex-start;

min-height:100vh;

}

.card{

width:100%;

max-width:450px;

background:white;

border-radius:24px;

padding:25px;

box-shadow:
0 10px 25px rgba(0,0,0,.08);

text-align:center;

}

h1{

font-size:32px;

color:#0f6c6d;

margin-bottom:25px;

}

h4{

font-size:18px;

color:#555;

margin-bottom:10px;

}

input{

width:100%;

box-sizing:border-box;

padding:14px;

font-size:18px;

border-radius:12px;

border:1px solid #ccc;

margin-bottom:15px;

}

button{

padding:14px 22px;

font-size:17px;

border:none;

border-radius:12px;

background:#0f6c6d;

color:white;

cursor:pointer;

margin:5px;

}

button:hover{

opacity:.9;

}

#app{

display:none;

}

#reader{

width:300px;

margin:auto;

}

#historial{

max-height:250px;

overflow-y:auto;

border:1px solid #ddd;

padding:10px;

border-radius:12px;

background:#fafafa;

}

#contador{

font-size:20px;

font-weight:bold;

margin:15px;

}

#btnEquipo{

background:#198754;

}

#btnSiguiente{

display:none;

background:#2c7be5;

}

.logo-principal{

width:220px;

max-width:90%;

margin:20px auto;

display:block;

}

.firma{

margin-top:30px;

padding-top:15px;

border-top:1px solid #e5e5e5;

color:#666;

font-size:13px;

}

.firma strong{

display:block;

color:#0f6c6d;

margin-bottom:6px;

}

</style>

</head>

<body>

<div class="card">

<h1>

REGISTRO DE USO DE EQUIPOS

</h1>

<div id="login">

<h4>Estudiante</h4>

<input
id="nombreCompleto"
placeholder="Nombre y Apellido">

<button
onclick="guardarUsuario()">

Continuar

</button>

<img
src="logo.png"
class="logo-principal">

</div>
<div id="app">

<h3 id="usuario"></h3>

<div id="contador">

Escaneados: 0

</div>

<button onclick="siguienteEstudiante()">

➡ Siguiente estudiante

</button>

<button onclick="deshacer()">

↩ Deshacer último

</button>

<button onclick="finalizarRegistro()">

📊 Exportar Excel

</button>

<button onclick="nuevaPlanilla()">

🗑 Nueva planilla

</button>

<h2>Escaneo</h2>

<button
id="btnEquipo"
onclick="iniciarEscaneo()">

📦 Escanear equipo

</button>

<div id="reader"></div>

<p id="resultado"></p>

<button
id="btnSiguiente"
onclick="siguientePaso()">

🎓 Escanear curso

</button>

<h2>Historial</h2>

<div id="historial"></div>

<div class="firma">

<strong>

Sistema de Registro QR

</strong>

<div>

Colegio Alberto Blest Gana

</div>

<div>

© 2026 Bastian Sepúlveda

</div>

</div>

</div>

</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script src="app.js"></script>

</body>
</html>
